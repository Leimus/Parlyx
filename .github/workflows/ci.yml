name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar deck (schema Zod + integridad)
        run: node scripts/validate-cards.mjs

      - name: Lenguaje humano (cero jerga de motor en pantalla)
        run: node scripts/check-lenguaje.mjs

      - name: Simulador — golden check (la lógica económica no cambió)
        run: node scripts/sim.mjs 10000 --check

      - name: Legibilidad (contraste WCAG + piso de 13px, SPEC v3 §1)
        run: node scripts/check-legibilidad.mjs

      - name: Invariante Parlyx (nunca caés más CON que SIN)
        run: node scripts/test-parlyx-invariante.mjs

      - name: Beat 2020 garantizado en las tres sillas (SPEC v3 §2.5)
        run: node scripts/test-beat-parlyx.mjs 10000

      - name: Smoke del core loop (deck real + motor real)
        run: node scripts/smoke-game.mjs 300

      - name: Build estático
        run: npm run build
